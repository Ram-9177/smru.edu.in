name: SEO Hardening CI

on:
  push:
    branches:
      - main
      - seo-hardening-phase-1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Build, lint audit, and SEO sanity checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Dependency audit
        run: npm audit --audit-level=critical

      - name: SEO guard
        run: npm run seo:guard

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Verify static-export contract
        run: |
          test -s out/sitemap.xml
          test -s out/robots.txt
          grep -Fq '<loc>https://smru.edu.in/' out/sitemap.xml
          grep -Fq 'Sitemap: https://smru.edu.in/sitemap.xml' out/robots.txt

      - name: Frontend release audit
        run: npm run audit:checklist -- ci --strict

      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: frontend-audit
          path: output/frontend-audit/ci/checklist-audit.json
          if-no-files-found: ignore
